<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau projet - Planit AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="min-h-screen bg-slate-50 text-slate=8000">
    <header class="flex items-center justify-between bg-white px-10 py-3 shadow-sm border-b border-slate-200 flex-wrap">
           <div id="logo" class=" flex items-center gap-3">
                 <img src="logo.png" alt="" class="w-25 h-25 object-contain">
           </div>
            <nav class="flex  items-center justify-around gap-10 mr-10 flex-wrap">
                <a href="#" class="text-blue-600 font-semibold border-b-2 border-blue-600 py-5">
                    Dashboard
                </a>
                <a href="#" class="text-blue-600 font-semibold border-b-2 border-blue-600 py-5">
                    Nouveau projet
                </a> 
                <a href="#" class="text-blue-600 font-semibold border-b-2 border-blue-600 py-5">
                    Paramètres
                </a>              
            </nav>
        
    </header>
    <main>
        <section id="formulaire">
            <h1 class="mt-8 font-bold text-2xl text-center"> Entrer les donnees de votre projet</h1>
            <form class=" mb-10 w-[80%] bg-blue-50 mx-auto mt-10  p-3 flex flex-col rounded-2xl shadow md:w-[40%]">
                <label for="nom">nom :</label> <br>
                <input type="text" nom="nom" placeholder="entrer le nom de votre projet" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="description">description :</label><br>
                <input type="text" nom="nom" placeholder="Entrer la description du projet" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="durée">durée du projet :</label><br>
                <input type="date" nom="durée" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="nbr-dev">nombre de développeurs :</label><br>
                <input type="number" nom="nbr-dev" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="techno">technologies :</label><br>
                <input type="text" nom="nom" placeholder="technologies" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="brief-complet">brief-complet :</label><br>
                <textarea name="brief-complet" id="" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"></textarea><br>
                <label for="niveau">niveau de difficulté :</label><br>
                <select name="niveau" id="niveau" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                    <option value=""></option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </form>

        </section>
    </main>

</body>
</html>
