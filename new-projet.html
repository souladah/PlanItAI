<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau projet - Planit AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./js/validation.js" defer></script>
    <script src="./js/js.js" defer></script>

</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
     <header class="flex items-center justify-between bg-white px-10 py-3 shadow-sm border-b border-slate-200 flex-wrap">
           <div id="logo" class=" flex items-center gap-3">
                 <img src="logo.png" alt="" class="w-30 h-30 object-contain">
           </div>
            <nav class="flex  items-center justify-around gap-10 mr-10 flex-wrap">
                <a href="index.html" class="text-blue-600 font-semibold  py-5">
                    Dashboard
                </a>
                <a href="new-projet.html" class="text-blue-600 font-semibold border-b-2 border-blue-600 py-5">
                    Nouveau projet
                </a> 
                <a href="#" id="openSettings" class="text-blue-600 font-semibold py-5">
                    Paramètres
                </a>              
            </nav>
        
    </header>
    <main>
        <dialog id="settingDialogue" class=" relative w-full max-w-md rounded-xl p-6 shadow-xl backdrop:bg-black/50 m-auto ">
            <h2 class="text-xl font-bold text-slate-800 mb-2">   Paramètres IA</h2>
            <button class="absolute top-3 right-5 cursor-pointer text-slate-400 w" id="fermer">✕</button>
            <p class="text-sm text-slate-500 mb-5"> Entrez votre clé API pour activer les fonctionnalités IA.</p>
            <label for="token" class="block text-sm font-semibold text-slate-700 mb-2">Clé API</label>
            <input type="password" name="token" id="token" placeholder="Entrer votre clé API" class="px-4 py-3 rounded-lg border border-slate-300 w-full  focus:ring-blue-500 focus:border-blue-500">
            <div class="flex justify-between my-10">
                  <button id="anulerBTn" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition">Annuler</button>
                  <button id="enregistrerBtn" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition">Enregistrer</button>
            </div>
            
        </dialog>
        <section id="formulaire">
            <h1 class="mt-8 font-bold text-2xl text-center"> Entrer les donnees de votre projet</h1>
            <form class=" mb-10 w-[80%] bg-blue-50 mx-auto mt-10  p-3 flex flex-col rounded-2xl shadow md:w-[40%]" novalidate>
                <label for="nom">nom :</label> <br>
                <input type="text" id="nom"  name="nom" placeholder="entrer le nom de votre projet" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="description">description :</label><br>
                <input type="text" id="description"  name="nom" placeholder="Entrer la description du projet" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="durée">durée du projet :</label><br>
                <input type="number" id="duree" name="durée" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="nbr-dev">nombre de développeurs :</label><br>
                <input type="number" id="nbDev" name="nbr-dev" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="techno">technologies :</label><br>
                <input type="text" id="techno" name="nom" placeholder="technologies" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="brief">brief-complet :</label><br>
                <textarea name="brief-complet"  id="brief" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"></textarea><br>
                <label for="niveau">niveau de difficulté :</label><br>
                <select name="niveau" id="niveau" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                    <option value=""></option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select> <br>
                <button type="submit" id="btnSubmit" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition">envoyer </button>
            </form>

        </section>
    </main>

</body>
</html>
