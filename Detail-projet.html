<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projet details</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./js/main.js" type="module"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
    <header class="flex items-center justify-between bg-white px-10 py-3 shadow-sm border-b border-slate-200 flex-wrap">
           <div id="logo" class=" flex items-center gap-3">
                 <img src="logo.png" alt="" class="w-30 h-30 object-contain">
           </div>
            <nav class="flex  items-center justify-around gap-10 mr-10 flex-wrap">
                <a href="index.html" class="text-blue-600 font-semibold border-b-2 border-blue-600 py-5">
                    Dashboard
                </a>
                <a href="new-projet.html" class="text-blue-600 font-semibold  py-5">
                    Nouveau projet
                </a> 
                <a href="#" id="openSettings" class="text-blue-600 font-semibold py-5">
                    Paramètres
                </a>              
            </nav>
        
    </header>
    <main>
         <dialog id="settingDialogue" class=" relative w-full max-w-md rounded-xl p-6 shadow-xl backdrop:bg-black/50 m-auto ">
            <h2 class="text-xl font-bold text-slate-800 mb-2">   Paramètres IA</h2>
            <button class="absolute top-3 right-5 cursor-pointer text-slate-400 w" id="fermer">✕</button>
            <p class="text-sm text-slate-500 mb-5"> Entrez votre clé API pour activer les fonctionnalités IA.</p>
            <label for="token" class="block text-sm font-semibold text-slate-700 mb-2">Clé API</label>
            <input type="password" name="token" id="token" placeholder="Entrer votre clé API" class="px-4 py-3 rounded-lg border border-slate-300 w-full  focus:ring-blue-500 focus:border-blue-500">
            <div class="flex justify-between my-10">
                  <button id="anulerBTn" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition">Annuler</button>
                  <button id="enregistrerBtn" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition">Enregistrer</button>
            </div>


        </dialog>
        <section id="details">

        

        </section>
        <dialog id="update-dialog" class="relativ w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-2xl p-8 shadow-xl backdrop:bg-black/50 m-auto">
                <button type="button" id="clos-update" class="absolute top-4 right-5 text-slate-400 hover:text-slate-700 cursor-pointer text-xl">✕</button>
            <form id="form-update"  class="flex flex-col gap-2" novalidate>
                <label for="u-nom">nom :</label> 
                <input type="text" id="u-nom"  name="u-nom" placeholder="entrer le nom de votre projet" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                <label for="u-description">description :</label>
                <input type="text" id="u-description"  name="u-description" placeholder="Entrer la description du projet" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                <label for="u-duree">durée du projet :</label>
                <input type="number" id="u-duree" name="u-duree" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                <label for="u-nbDev">nombre de développeurs :</label>
                <input type="number" id="u-nbDev" name="u-nbDev" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                <label for="u-techno">technologies :</label>
                <input type="text" id="u-techno" name="u-techno" placeholder="technologies" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                <label for="u-brief">brief-complet :</label>
                <textarea name="u-brief"  id="u-brief" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"></textarea>
                <label for="u-niveau">niveau de difficulté :</label>
                <select name="u-niveau" id="u-niveau" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                    <option value=""></option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select> 

                <h3 class="text-lg font-bold text-slate-800 mt-6 pt-4  border-t border-slate-200">Les infos du tache</h3>

                <label for="id-tache" >id :</label>
                <input id="id-tache" type="text" name="id-tache" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">

                <label for="nom-tache">nom :</label>
                <input id="nom-tache" type="text" name="nom-tache" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">

                <label for="acceptanceCriteria" >acceptanceCriteria :</label>
                <input name="acceptanceCriteria" id="acceptanceCriteria" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">

                

                <label for="t-priority" >priority :</label>
                <input id="t-priority" type="text" name="t-priority" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">

                <label for="importance">importance :</label>
                <input type="text" name="importance" id="importance" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">

                
                <label for="size" >size :</label>
                <input type="text" id="size" name="size" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">

                <label for="estimatedTime" >estimatedTime :</label>
                <input type="number" id="estimatedTime" name="estimatedTime" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">

                
                <label for="deadline" >deadline :</label>
                <input type="text"  id="deadline" name="deadline" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">

                <label for="status" >status :</label>
                <select type="text" id="status" name="deadline" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                     <option value="To Do">To Do</option>
                     <option value="In Progress">In Progress</option>
                     <option value="Done">Done</option>
                </select>

                <label for="dependencies" >dependencies :</label>
                <input name="dependencies" id="dependencies" multiple class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                     

                <button id="anulerBTn" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition">Annuler</button>
                <button id="enregistrerBtn" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition">Enregistrer</button>

            </form>

        </dialog>
    </main>

</body>
</html>
