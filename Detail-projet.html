<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projet details</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./js/main.js" type="module"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
    <header class="flex items-center justify-between bg-white px-10 py-3 shadow-sm border-b border-slate-200 flex-wrap">
           <div id="logo" class=" flex items-center gap-3">
                 <img src="logo.png" alt="" class="w-30 h-30 object-contain">
           </div>
            <nav class="flex  items-center justify-around gap-10 mr-10 flex-wrap">
                <a href="index.html" class="text-blue-600 font-semibold border-b-2 border-blue-600 py-5">
                    Dashboard
                </a>
                <a href="new-projet.html" class="text-blue-600 font-semibold  py-5">
                    Nouveau projet
                </a> 
                <a href="#" id="openSettings" class="text-blue-600 font-semibold py-5">
                    Paramètres
                </a>              
            </nav>
        
    </header>
    <main>
         <dialog id="settingDialogue" class=" relative w-full max-w-md rounded-xl p-6 shadow-xl backdrop:bg-black/50 m-auto ">
            <h2 class="text-xl font-bold text-slate-800 mb-2">   Paramètres IA</h2>
            <button class="absolute top-3 right-5 cursor-pointer text-slate-400 w" id="fermer">✕</button>
            <p class="text-sm text-slate-500 mb-5"> Entrez votre clé API pour activer les fonctionnalités IA.</p>
            <label for="token" class="block text-sm font-semibold text-slate-700 mb-2">Clé API</label>
            <input type="password" name="token" id="token" placeholder="Entrer votre clé API" class="px-4 py-3 rounded-lg border border-slate-300 w-full  focus:ring-blue-500 focus:border-blue-500">
            <div class="flex justify-between my-10">
                  <button id="anulerBTn" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition">Annuler</button>
                  <button id="enregistrerBtn" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition">Enregistrer</button>
            </div>


        </dialog>
        

         <div class="max-w-7xl mx-auto px-4 sm:px-6 pt-6">
            <button type="button" onclick="history.back()"  class="cursor-pointer text-blue-600 font-semibold">←Retour</button>
         </div>
        <section id="details">

        </section>
        <dialog id="update-dialog" class="relative w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-2xl p-8 shadow-xl backdrop:bg-black/50 m-auto">
                <button type="button" id="clos-update" class="absolute top-4 right-5 text-slate-400 hover:text-slate-700 cursor-pointer text-xl">✕</button>
            <form id="form-update"  class="flex flex-col gap-2" novalidate>


                <h3 class="text-lg font-bold text-slate-800 mt-6 pt-4  ">Les infos du tache</h3>

                

                <label for="nom-tache">nom :</label>
                <input id="nom-tache" type="text" name="nom-tache" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">

                <label for="acceptanceCriteria" >acceptanceCriteria :</label>
                <textarea name="acceptanceCriteria" id="acceptanceCriteria" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"></textarea>

                

                <label for="t-priority" >priority :</label>
                <select id="t-priority"   class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                    <option value="Critical">Critical</option>

                </select>
                <label for="importance">importance :</label>
                <select id="importance"   class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
                
                <label for="size" >size :</label>
                <select id="size"   class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>

                </select>

                <label for="estimatedTime" >estimatedTime :</label>
                <input type="number" id="estimatedTime" name="estimatedTime" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">

                
                <label for="deadline" >deadline :</label>
                <input type="text"  id="deadline" name="deadline" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">

                <label for="status" >status :</label>
                <select  id="status" name="status" class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                     <option value="To Do">To Do</option>
                     <option value="In Progress">In Progress</option>
                     <option value="Done">Done</option>
                </select>

                <label for="dependencies" >dependencies :</label>
                <input type="text" name="dependencies" id="dependencies"  class="w-full border-2 border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                     
                <button type="submit" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition">Enregistrer</button>
                <button type="button" id="btnanluer" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition">Annuler</button>
                <button type="button" id="supprimer" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition">supprimer</button>

            </form>

        </dialog>
        <dialog id="update-projet-dialog" class="relative w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-2xl p-8 shadow-xl backdrop:bg-black/50 m-auto">
            <button class="absolute top-3 right-5 cursor-pointer text-slate-400 w" id="clos-update-projet">✕</button>
            <h2 class="text-xl font-bold text-slate-800 mb-2">  Les infos du projet</h2>

            <form id="form-update-projet"  class=" mb-10 w-[80%] bg-blue-50 mx-auto mt-10  p-3 flex flex-col rounded-2xl shadow md:w-[40%]" novalidate>
                
                <label for="nom">nom :</label> <br>
                <input type="text" id="nom"  name="nom" placeholder="entrer le nom de votre projet" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="description">description :</label><br>
                <input type="text" id="description"  name="nom" placeholder="Entrer la description du projet" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="duree">durée du projet :</label><br>
                <input type="number" id="duree" name="durée" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="nbDev">nombre de développeurs :</label><br>
                <input type="number" id="nbDev" name="nbr-dev" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="techno">technologies :</label><br>
                <input type="text" id="techno" name="nom" placeholder="technologies" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"><br>
                <label for="brief">brief-complet :</label><br>
                <textarea name="brief-complet"  id="brief" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none"></textarea><br>
                <label for="niveau">niveau de difficulté :</label><br>
                <select name="niveau" id="niveau" class="w-full border-2   border-gray-400 rounded-lg p-2 focus:border-sky-500 focus:outline-none">
                    <option value=""></option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select> <br>
                <div class="flex  text-center items-center justify-between">

                
                <button type="button" id="btnanluer-projet" class=" w-[50%] cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition
                 disabled:opacity-50 disabled:cursor-not-allowed">
                   annuler
                </button>
                <button type="submit" id="btnenregistrerprojet" class=" w-[50%] cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-semibold transition
                 disabled:opacity-50 disabled:cursor-not-allowed">
                   enregistrer
                </button>
               </div>

            </form>
        </dialog>
    </main>

</body>
</html>
